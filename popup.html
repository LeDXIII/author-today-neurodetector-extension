<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px;
      max-height: 520px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }
    h1 {
      font-size: 16px; color: #00d4ff; margin-bottom: 8px;
      display: flex; align-items: center; gap: 8px;
    }
    h1::before { content: "🤖"; }

    .disclaimer {
      font-size: 10px; color: #888; background: #16213e;
      padding: 6px 10px; border-radius: 6px; margin-bottom: 10px;
      border-left: 3px solid #ff9800;
      line-height: 1.4;
    }

    .status {
      font-size: 13px; padding: 8px 12px; border-radius: 6px;
      background: #16213e; margin-bottom: 10px; min-height: 36px;
    }
    .status.info { border-left: 3px solid #00d4ff; }
    .status.success { border-left: 3px solid #4caf50; }
    .status.error { border-left: 3px solid #f44336; }
    .status.loading { border-left: 3px solid #ff9800; }

    #check-btn {
      width: 100%; padding: 10px; font-size: 14px; font-weight: 600;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; border: none; border-radius: 8px; cursor: pointer;
    }
    #check-btn:hover { opacity: 0.9; }
    #check-btn:disabled { background: #555; cursor: not-allowed; opacity: 0.5; }

    .progress-bar {
      width: 100%; height: 6px; background: #16213e; border-radius: 3px;
      margin: 8px 0; overflow: hidden; display: none;
    }
    .progress-bar.active { display: block; }
    .progress-bar-fill {
      height: 100%; background: linear-gradient(90deg, #00d4ff, #667eea);
      transition: width 0.3s; width: 0%;
    }
    .progress-text {
      font-size: 11px; color: #888; text-align: center;
      margin-bottom: 8px; display: none;
    }
    .progress-text.active { display: block; }

    .results {
      background: #16213e; border-radius: 8px; padding: 12px; display: none;
    }
    .results.active { display: block; }
    .results-header { font-size: 13px; font-weight: 600; color: #00d4ff; margin-bottom: 8px; }
    .book-title { font-size: 12px; color: #aaa; margin-bottom: 10px; font-style: italic; }

    .stats { display: flex; gap: 12px; margin-bottom: 10px; }
    .stat-box {
      flex: 1; text-align: center; padding: 8px; border-radius: 6px; background: #0f3460;
    }
    .stat-box.ai { border-bottom: 3px solid #f44336; }
    .stat-box.human { border-bottom: 3px solid #4caf50; }
    .stat-value { font-size: 24px; font-weight: 700; }
    .stat-box.ai .stat-value { color: #f44336; }
    .stat-box.human .stat-value { color: #4caf50; }
    .stat-label { font-size: 11px; color: #888; margin-top: 2px; }

    .verdict { font-size: 12px; padding: 8px; border-radius: 6px; text-align: center; }
    .verdict.high-ai { background: rgba(244, 67, 54, 0.2); color: #f44336; }
    .verdict.mid-ai { background: rgba(255, 152, 0, 0.2); color: #ff9800; }
    .verdict.low-ai { background: rgba(76, 175, 80, 0.2); color: #4caf50; }

    .chapters-info { font-size: 11px; color: #666; margin-top: 8px; text-align: center; }

    .history-section { margin-top: 12px; }
    .history-header { font-size: 12px; font-weight: 600; color: #888; margin-bottom: 6px; }
    .history-list {
      max-height: 150px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-track { background: #16213e; border-radius: 2px; }
    .history-list::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
    .history-item {
      padding: 6px 8px; margin-bottom: 4px; border-radius: 4px;
      background: #0f3460; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
    }
    .history-item:hover { background: #1a4a7a; }
    .history-item-title {
      font-size: 11px; color: #ccc; flex: 1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .history-item-ai { font-size: 10px; margin-left: 8px; white-space: nowrap; }
    .history-item-date { font-size: 9px; color: #666; margin-left: 6px; white-space: nowrap; }
  </style>
</head>
<body>
  <h1>Author.today NeuroDetector</h1>

  <div class="disclaimer">
    ️ Проверка выполняется только по <b>бесплатным</b> главам. Результат по полной книге может отличаться.
  </div>

  <div id="status" class="status info">Откройте страницу книги на author.today</div>

  <button id="check-btn" disabled>Проверить книгу</button>

  <div id="progress-bar" class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
  <div id="progress-text" class="progress-text"></div>

  <div id="results" class="results">
    <div class="results-header">Результат проверки</div>
    <div class="book-title" id="book-title"></div>
    <div class="stats">
      <div class="stat-box ai">
        <div class="stat-value" id="ai-pct">0%</div>
        <div class="stat-label">ИИ текст</div>
      </div>
      <div class="stat-box human">
        <div class="stat-value" id="human-pct">0%</div>
        <div class="stat-label">Человек</div>
      </div>
    </div>
    <div id="verdict" class="verdict"></div>
    <div id="chapters-info" class="chapters-info"></div>
    <div id="last-check-info" class="chapters-info" style="display:none;margin-top:4px;"></div>
  </div>

  <div id="history" class="history-section" style="display:none;">
    <div class="history-header">Проверенные книги:</div>
    <div class="history-list" id="history-list"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
